name: Case study evidence probe (temporary)

on:
  push:
    branches: [docs/327-fastapi-case-study]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: fastapi/fastapi
          ref: b2831196bfee3eb9ce303a3c6440f2a104832954
          path: fastapi-study
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Install wheelgap from this branch
        run: python -m pip install wheelgap==0.13.0
      - name: Scan FastAPI's CI targets using its pinned lockfile
        shell: bash
        run: |
          set +e
          wheelgap fastapi-study/uv.lock -p 3.15 -t linux-x86_64,win-amd64,macos-arm64 --no-dev --group tests --extra all --explain --suggest > scan.txt 2>&1
          status=$?
          set -e
          echo "wheelgap exit: $status"
          cat scan.txt
          if [ "$status" -eq 2 ]; then exit 2; fi
      - name: Independently check PyYAML binary availability with pip
        shell: bash
        run: |
          python -m pip --version
          for platform in win_amd64 macosx_11_0_arm64 manylinux_2_28_x86_64; do
            for requirement in 'PyYAML==6.0.3' 'PyYAML>=6.0.3'; do
              mkdir -p "$RUNNER_TEMP/wheels"
              set +e
              python -m pip --isolated download --no-deps --only-binary=:all:                 --python-version 3.15 --implementation cp --abi cp315 --platform "$platform"                 --dest "$RUNNER_TEMP/wheels" "$requirement" > check.log 2>&1
              code=$?
              set -e
              echo "$platform | $requirement | pip exit $code"
              grep -E 'ERROR: No matching distribution|Saved |Successfully downloaded|Downloading ' check.log | tail -n 4 || true
              rm -f "$RUNNER_TEMP/wheels/"*
            done
          done
